name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [zh-cn]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Chinese Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Add Chinese language to the app
        run: |
          test -f src/i18n/locales/zh.json || { echo "src/i18n/locales/zh.json is missing"; exit 1; }
          python3 - <<'PY'
          import pathlib, sys

          def patch(path, old, new, marker):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              if marker in s:
                  print("already patched:", path, "->", marker)
                  return
              if old not in s:
                  sys.exit("PATCH FAILED: " + path + ": text not found: " + old)
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("patched:", path)

          patch("src/types/settings.ts",
                "export type Language = 'en' | 'de';",
                "export type Language = 'en' | 'de' | 'zh';",
                "'zh'")
          patch("src/i18n/index.ts",
                "import de from './locales/de.json';\n",
                "import de from './locales/de.json';\nimport zh from './locales/zh.json';\n",
                "locales/zh.json")
          patch("src/i18n/index.ts",
                "  de: { translation: de },\n",
                "  de: { translation: de },\n  zh: { translation: zh },\n",
                "zh: { translation: zh }")
          patch("src/features/manage/DisplayScreen.tsx",
                '<RadioButton.Item label="Deutsch" value="de" />',
                '<RadioButton.Item label="Deutsch" value="de" />\n          <RadioButton.Item label="简体中文" value="zh" />',
                'value="zh"')
          patch("src/store/settingsStore.ts",
                "  language: 'en',\n  isLoaded: false,",
                "  language: 'zh',\n  isLoaded: false,",
                "language: 'zh',")
          patch("src/store/settingsStore.ts",
                "parsed.language || 'en'",
                "parsed.language || 'zh'",
                "parsed.language || 'zh'")
          patch("app.json",
                '"package": "com.paperlessnative.mobile",',
                '"package": "com.paperlessnative.mobile.zh",',
                "com.paperlessnative.mobile.zh")
          PY

      - name: Add API key login to the app
        run: |
          python3 - <<'PY'
          import pathlib, sys, json

          def patch(path, old, new, marker):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              if marker in s:
                  print("already patched:", path, "->", marker)
                  return
              if s.count(old) != 1:
                  sys.exit("PATCH FAILED: " + path + ": expected exactly 1 match, got " + str(s.count(old)) + ": " + old)
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("patched:", path, "->", marker)

          L = "src/features/auth/LoginScreen.tsx"

          patch(L, "import * as Clipboard from 'expo-clipboard';\n",
                   "import axios from 'axios';\nimport * as Clipboard from 'expo-clipboard';\n",
                   "import axios from 'axios';")

          patch(L, "  const [showPassword, setShowPassword] = useState(false);\n",
                   "  const [showPassword, setShowPassword] = useState(false);\n"
                   "  const [apiKey, setApiKey] = useState('');\n"
                   "  const [showApiKey, setShowApiKey] = useState(false);\n",
                   "const [apiKey, setApiKey]")

          patch(L, "    if (!url || !username || !password) return;\n",
                   "    const useApiKey = apiKey.trim().length > 0;\n"
                   "    if (!url || (!useApiKey && (!username || !password))) return;\n",
                   "const useApiKey")

          patch(L, "      const response = await authApi.login(username, password, mfaRequired ? mfaCode : undefined);\n",
                   "      let response: { token: string };\n"
                   "      let loginName = username;\n"
                   "      if (useApiKey) {\n"
                   "        const keyToken = apiKey.trim();\n"
                   "        const me = await axios.get(`${cleanUrl}/api/ui_settings/`, {\n"
                   "          headers: {\n"
                   "            Authorization: `Token ${keyToken}`,\n"
                   "            Accept: 'application/json; version=9',\n"
                   "          },\n"
                   "          timeout: 30000,\n"
                   "        });\n"
                   "        loginName = me.data?.user?.username || '';\n"
                   "        response = { token: keyToken };\n"
                   "      } else {\n"
                   "        response = await authApi.login(username, password, mfaRequired ? mfaCode : undefined);\n"
                   "      }\n",
                   "let loginName")

          patch(L, "      await setStoredUsername(username);\n",
                   "      await setStoredUsername(loginName);\n",
                   "setStoredUsername(loginName)")

          patch(L, "params: { username } });",
                   "params: { username: loginName } });",
                   "params: { username: loginName }")

          patch(L, "list.results?.find((u) => u.username === username) || null;",
                   "list.results?.find((u) => u.username === loginName) || null;",
                   "u.username === loginName")

          patch(L, "          {mfaRequired ? (\n            <Animated.View",
                   "          <View style={styles.mfaDivider}>\n"
                   "            <View style={[styles.mfaDividerLine, { backgroundColor: theme.colors.outlineVariant }]} />\n"
                   "            <Text variant=\"bodySmall\" style={{ color: theme.colors.onSurfaceVariant }}>\n"
                   "              {t('auth.or')}\n"
                   "            </Text>\n"
                   "            <View style={[styles.mfaDividerLine, { backgroundColor: theme.colors.outlineVariant }]} />\n"
                   "          </View>\n\n"
                   "          <TextInput\n"
                   "            label={t('auth.apiKey')}\n"
                   "            value={apiKey}\n"
                   "            onChangeText={setApiKey}\n"
                   "            mode=\"outlined\"\n"
                   "            autoCapitalize=\"none\"\n"
                   "            autoCorrect={false}\n"
                   "            secureTextEntry={!showApiKey}\n"
                   "            left={<TextInput.Icon icon=\"key\" />}\n"
                   "            right={\n"
                   "              <TextInput.Icon\n"
                   "                icon={showApiKey ? 'eye-off' : 'eye'}\n"
                   "                onPress={() => setShowApiKey(!showApiKey)}\n"
                   "              />\n"
                   "            }\n"
                   "            style={styles.input}\n"
                   "          />\n\n"
                   "          {mfaRequired ? (\n            <Animated.View",
                   "t('auth.apiKey')")

          patch(L, "              loading || !url || !username || !password || (mfaRequired && mfaCode.length !== 6)\n",
                   "              loading ||\n"
                   "              !url ||\n"
                   "              (apiKey.trim().length === 0 && (!username || !password)) ||\n"
                   "              (mfaRequired && mfaCode.length !== 6)\n",
                   "apiKey.trim().length === 0 &&")

          TEXT = {
            "en": ("API Key", "OR"),
            "de": ("API-Schlüssel", "ODER"),
            "zh": ("API 密钥", "或"),
          }
          for lang, (k, o) in TEXT.items():
              path = f"src/i18n/locales/{lang}.json"
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              if '"apiKey"' in s:
                  print("already patched:", path); continue
              anchor = '    "mfaCode":'
              if s.count(anchor) != 1:
                  sys.exit("PATCH FAILED: " + path + ": mfaCode anchor count " + str(s.count(anchor)))
              s = s.replace(anchor, f'    "apiKey": "{k}",\n    "or": "{o}",\n' + anchor, 1)
              json.loads(s)
              p.write_text(s, encoding="utf-8")
              print("patched:", path)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -alias zhbuild -keyalg RSA -keysize 2048 -validity 10000 -storepass paperless-zh -keypass paperless-zh -dname "CN=Paperless Chinese Build"
          printf 'storeFile=upload-keystore.jks\nstorePassword=paperless-zh\nkeyAlias=zhbuild\nkeyPassword=paperless-zh\n' > android/key.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperless-zh-apk
          path: android/app/build/outputs/apk/release/*.apk
